[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytint"
version = "0.1.0"
description = "High-Dimensional YouTube Conversational Analytics & Forensics Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=15.0.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
    "textstat>=0.7.3",
    "emoji>=2.10.0",
    "gigatoken>=0.10.0",
    "spacy>=3.7.0",
    "stopwordsiso>=0.6.1",
    "langdetect>=1.0.9",
    "sentence-transformers>=2.2.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "bertopic>=0.16.0",
    "gensim>=4.3.0",
    "umap-learn>=0.5.5",
    "hdbscan>=0.8.33",
    "detoxify>=0.5.0",
    "vaderSentiment>=3.3.2",
    "networkx>=3.2",
    "python-louvain>=0.16",
    "lifelines>=0.28.0",
    "causalimpact>=0.1.1",
    "statsmodels>=0.14.0",
    "ruptures>=1.1.3",
    "prophet>=1.1.5",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "powerlaw>=1.5.0",
    "datasketch>=1.6.0",
    "scikit-posthocs>=0.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "joypy>=0.2.6",
    "wordcloud>=1.9.0",
    "streamlit>=1.30.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "duckdb>=1.0.0"
]

[project.scripts]
ytint-runner = "pipeline.runner:main"
ytint-app = "ui.app:main"
ytint-report = "engine.reporter:main"
ytint-ingest = "engine.youtube_api:main"
ytint-ai = "engine.synthesizer:main"
ytint-graph = "engine.network_exporter:main"
ytint-alert = "engine.alerting:main"
ytint-search = "engine.semantic_search:main"
ytint-replay = "engine.event_replay:main"
ytint-assist = "engine.assistant:main"
ytint-sql = "engine.sql_engine:main"
ytint-narrative = "engine.narrative:main"
ytint-fingerprint = "engine.fingerprint:main"
ytint-compare = "engine.comparator:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
