agents:
  default:
    name: default
    model: gpt-5-mini
    api_key_env: OPENAI_API_KEY
    max_tokens: 1024
    timeout: 30
    description: Default general-purpose agent

  analytics_agent:
    name: analytics_agent
    model: gpt-5-mini
    api_key_env: ANALYTICS_API_KEY
    max_tokens: 2048
    timeout: 60
    description: Agent for analytics and data processing
