# ytint Parameter & Directory Registry

paths:
  # Source SQLite database file location
  raw_db: "data/raw/commentsuite.sqlite3"
  # Folder targets for pipeline execution caches
  interim_dir: "data/interim"
  output_dir: "data/output"

stage_01_enrich:
  sentiment_model: "blanchefort/rubert-base-cased-sentiment"
  batch_size: 32               # Keep this modest to ensure it fits in GPU memory
  chunk_size: 5000             # Processing chunk size for memory-safe batching
  max_length: 256              # Transformer tokenizer max sequence length
  go_emotions_model: "cointegrated/rubert-tiny2-cedr-emotion-detection"
  go_emotions_top_k: 3        # Number of top emotion labels to extract

stage_02_topics:
  # Multilingual (50+ languages incl. ru/uk)
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  min_topic_size: 25
  n_drift_slices: 6            # Number of temporal quantiles for semantic drift
  word2vec_dim: 30             # Word2Vec embedding dimensions for drift tracking
  word2vec_window: 5           # Word2Vec context window size

stage_07_stance:
  sentiment_favor_threshold: 0.35     # Min positive sentiment to infer Favor
  sentiment_against_threshold: -0.35  # Max negative sentiment to infer Against
  toxicity_against_threshold: 0.5     # Min toxicity to infer Against stance
  toxicity_favor_ceiling: 0.2         # Max toxicity to infer Favor from sentiment alone
  conflict_toxicity_threshold: 0.4    # Threshold for high-conflict thread flagging
  conflict_max_threads: 100           # Max polarized threads to export

stage_08_code_switching:
  min_alpha_chars: 10          # Minimum alphabetic characters for detection
  min_secondary_chars: 3       # Min chars in secondary script to flag code-switching
  secondary_ratio: 0.15        # Minimum fraction of secondary alphabet

stage_28_narrative:
  change_point_penalty: "auto"
  z_threshold: 2.5

# === Forensic & Analytical Detection Thresholds ===

stage_26_integrity:
  lsh_threshold: 0.8           # MinHash Jaccard similarity threshold for near-duplicate spam clusters
  lsh_num_perm: 128            # Number of MinHash permutation hashes
  burst_window_minutes: 5      # Rolling time-series bin size in minutes for burst brigading
  burst_multiplier: 10.0       # Volume multiplier over median rate to flag temporal brigading bursts

stage_20_frequency_tiers:
  casual_max: 5                # Upper comment count bound for Casual tier (2-5)
  regular_max: 20              # Upper comment count bound for Regular tier (6-20)
  superfan_max: 100            # Upper comment count bound for Super-Fan tier (21-100)

stage_24_bot_heuristics:
  tier1_min_comments: 10       # Comment volume cutoff for Tier 1 spam duplicate check
  tier1_max_unique_ratio: 0.2  # Max unique token ratio to classify as duplicate spammer
  tier2_min_comments: 50       # Comment volume cutoff for high-volume Tier 2 duplicate check
  tier2_max_unique_ratio: 0.5  # Max unique token ratio for high-volume accounts
  reused_name_min_comments: 5  # Comments cutoff for accounts with duplicate display names
  reused_name_max_unique: 0.3  # Max unique ratio for accounts with duplicate display names

stage_21_driveby_loyalists:
  driveby_max_videos: 1        # Max unique videos commented on for Drive-by tier
  casual_max_videos: 3         # Max unique videos commented on for Casual tier (2-3)

stage_27_like_inflation:
  min_like_count: 5            # Minimum absolute likes required to evaluate like inflation
  inflation_quantile: 0.99     # Quantile threshold for top anomalous like-to-reply ratios
  min_inflation_ratio: 20.0    # Floor threshold for like-to-reply ratio (likes per reply)
  bot_inflation_ratio: 10.0    # Lower threshold when author is already classified as a suspected bot

stage_23_impersonation:
  min_name_length: 6           # Minimum display name length to avoid false positives on short/common names
  min_unique_accounts: 2       # Minimum distinct channel IDs sharing the same display name to flag

stage_25_cib:
  time_window_seconds: 120     # Max temporal delta in seconds between comments to flag as synchronized
  min_cooccurrences: 2         # Minimum synchronized events across video uploads to flag as CIB ring

stage_15_toxicity:
  toxicity_threshold: 0.5      # Minimum toxicity score (0.0 to 1.0) to classify a comment as toxic
  catalyst_min_toxic: 2        # Minimum toxic comments for author to qualify as Troll Catalyst
  catalyst_min_score: 10.0     # Minimum catalyst impact score for high instigator tier

stage_36_arrival_speed:
  first_responder_days: 1      # Threshold for "First Responder" tier
  on_time_days: 7              # Threshold for "On-Time" tier
  late_arrival_days: 30        # Threshold for "Late Arrival" / "Necromancer" boundary
  arrival_curve_minutes: 120   # Time window for minute-level arrival velocity curve

stage_38_modeling:
  xgboost_n_estimators: 100           # XGBoost tree count
  xgboost_learning_rate: 0.1          # XGBoost learning rate
  xgboost_max_depth: 5                # XGBoost max tree depth (regressor)
  xgboost_clf_max_depth: 4            # XGBoost max tree depth (classifiers)
  train_test_split: 0.8               # Chronological train/test split ratio
  shap_max_samples: 1000              # Max SHAP explanation samples
  isolation_forest_contamination: 0.01 # Expected bot/anomaly fraction
  stl_period: 7                        # STL seasonality period (days)
  minhash_threshold: 0.7               # MinHash Jaccard spam threshold
  minhash_num_perm: 128                # MinHash permutation count
  minhash_min_cluster: 3               # Min cluster size for spam flag
  poisson_window: "15T"                # Poisson burst time window
  poisson_p_threshold: 0.001           # Poisson burst p-value threshold
  forecast_periods: 30                 # Forward forecast horizon (days)
  kw_min_group_size: 10                # Min comments per video for Kruskal-Wallis
  kw_max_groups: 50                    # Max video groups for post-hoc matrix
  viral_early_minutes: 120             # "Early burst" window for viral classifier
  viral_top_percentile: 0.90           # Top-N% like threshold for viral label
  survival_censoring_days: 7           # Right-censoring window for Kaplan-Meier

stage_39_creator_uplift:
  early_window_minutes: 120    # Time window (minutes since upload) defining early creator intervention

ui:
  palette:
    background: "#0b0e14"      # Deep Kibana dark canvas
    sidebar: "#11151c"         # Structural slate navigation tone
    surface: "#171d26"         # Lighter dark tone for metric cards
    grid: "#283243"            # Subtle border line for card grids
    text: "#e2e8f0"            # Clean off-white text readability
    primary: "#0066fe"         # Bloomberg crisp operational blue
    accent: "#00f0ff"          # Cyber cyan highlight tracking
    sentiment_pos: "#00ff66"   # Viridian positive metric accent
    sentiment_neg: "#ff3366"   # Crimson negative metric accent

# === LLM & Natural Language Insight Synthesis ===
llm_analysis:
  default_provider: "gemini"      # gemini | ollama | openai | mock
  default_model: "gemini-2.0-flash"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "llama3"
  max_tokens: 1024
  temperature: 0.3

# === Automated Webhook Anomaly & Threat Alerting ===
alerting:
  enabled: true
  webhook_url: ""               # Discord, Slack, Telegram, or generic webhook URL (or env YTINT_WEBHOOK_URL)
  webhook_type: "auto"          # auto | discord | slack | telegram | generic
  telegram_chat_id: ""          # Required if webhook_type is telegram (or env YTINT_TELEGRAM_CHAT_ID)
  severity_threshold: "WARNING" # Minimum severity to dispatch: INFO | WARNING | CRITICAL
  rules:
    cib_rings:
      enabled: true
      severity: "CRITICAL"
      min_ring_size: 2
    impersonation:
      enabled: true
      severity: "CRITICAL"
    viral_spikes:
      enabled: true
      severity: "WARNING"
      min_z_score: 3.0
    sentiment_negativity_spike:
      enabled: true
      severity: "WARNING"
      min_negative_z_score: 2.5
    toxicity_outbreak:
      enabled: true
      severity: "WARNING"
      min_r0: 1.0
      min_toxic_share: 0.15
    troll_catalysts:
      enabled: true
      severity: "WARNING"
      min_catalyst_score: 10.0
    like_inflation:
      enabled: true
      severity: "WARNING"
      min_suspicious_count: 5
    topic_injection:
      enabled: true
      severity: "INFO"
      min_jsd: 0.35