# ytint Parameter & Directory Registry

paths:
  # Source SQLite database file location
  raw_db: "data/raw/commentsuite.sqlite3"
  # Folder targets for pipeline execution caches
  interim_dir: "data/interim"
  output_dir: "data/output"

stage_01_enrich:
  sentiment_model: "blanchefort/rubert-base-cased-sentiment"
  batch_size: 32 # Keep this modest to ensure it fits in GPU memory

stage_02_topics:
# Multilingual (50+ languages incl. ru/uk) — all-MiniLM-L6-v2 is English-only
# and produces degraded embeddings (not just labels) on Cyrillic input.
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"
  min_topic_size: 15

stage_03_narrative:
  change_point_penalty: 3.0
  z_threshold: 2.5

ui:
  palette:
    background: "#0b0e14"      # Deep Kibana dark canvas
    sidebar: "#11151c"         # Structural slate navigation tone
    surface: "#171d26"         # 👈 Added: Lighter dark tone for metric cards
    grid: "#283243"            # 👈 Added: Subtle border line for card grids
    text: "#e2e8f0"            # Clean off-white text readability
    primary: "#0066fe"         # Bloomberg crisp operational blue
    accent: "#00f0ff"          # Cyber cyan highlight tracking
    sentiment_pos: "#00ff66"   # Viridian positive metric accent
    sentiment_neg: "#ff3366"   # Crimson negative metric accent
    